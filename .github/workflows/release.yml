name: Release

# Publishes to npm with provenance when a v* tag is pushed. Publishing from CI
# via OIDC ("trusted publishing") binds the tarball to this commit/tag and
# removes the need for a long-lived npm token on a laptop.
#
# One-time setup on npmjs.com: configure @kirkelabs/walletless-kit as a trusted
# publisher for this repo + workflow, and require 2FA on the account.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm provenance / OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # prepublishOnly re-runs lint+test; --provenance attests tarball -> commit.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
